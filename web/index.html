<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>concept2upload</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <img id="avatar-img" class="avatar hidden" alt="" />
      <h1><a href="index.html">concept2upload</a></h1>
    </div>
    <div id="auth-area"></div>
  </header>

  <div id="signed-out" class="card">
    <p>Sign in to see your Concept2 workouts and download them as .tcx files.</p>
    <button id="sign-in" class="primary">Sign in with Google</button>
  </div>

  <div id="signed-in" class="hidden">
    <div class="card">
      <div class="table-scroll">
        <table id="workouts">
          <thead>
            <tr><th>Date</th><th>Type</th><th>Distance</th><th>Time</th><th>Workout</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="table-footer">
      <label>
        Show
        <select id="limit-select">
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="40">40</option>
          <option value="50">50</option>
          <option value="250">All (up to 250)</option>
        </select>
      </label>

      <div class="pagination">
        <button id="prev-page">&lsaquo; Previous</button>
        <span id="page-info" class="muted"></span>
        <button id="next-page">Next &rsaquo;</button>
      </div>

      <span class="spacer"></span>
      <button id="refresh-list">Refresh</button>
    </div>
  </div>

  <div id="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>

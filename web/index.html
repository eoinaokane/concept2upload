<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>concept2upload</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>concept2upload</h1>
    <div id="auth-area"></div>
  </header>

  <div id="signed-out" class="card">
    <p>Sign in to see your Concept2 workouts and download them as .tcx files.</p>
    <button id="sign-in" class="primary">Sign in with Google</button>
  </div>

  <div id="signed-in" class="hidden">
    <div class="card">
      <div class="controls">
        <label>
          Show
          <select id="limit-select">
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
            <option value="250">All (up to 250)</option>
          </select>
        </label>
        <span class="spacer"></span>
        <button id="refresh-list">Refresh</button>
      </div>

      <div class="table-scroll">
        <table id="workouts">
          <thead>
            <tr><th>Date</th><th>Type</th><th>Distance</th><th>Time</th><th>Workout</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>

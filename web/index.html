<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>concept2upload</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --border: #e2e4e9;
      --text: #1a1d23;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --error: #dc2626;
      --row-hover: #f3f6ff;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --surface: #1c1f26;
        --border: #2c303a;
        --text: #e8eaed;
        --muted: #9aa1ac;
        --accent: #5b8def;
        --accent-hover: #7ba3f5;
        --error: #f87171;
        --row-hover: #23283a;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.4);
      }
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 1.375rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
    }
    #auth-area {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 1.5rem;
    }
    .card + .card { margin-top: 1.25rem; }

    button {
      cursor: pointer;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 500;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    button:hover { background: var(--row-hover); }
    button:disabled { opacity: 0.5; cursor: default; }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    input, select {
      font: inherit;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
    }
    input:focus, select:focus, button:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    #concept2-token-row { display: flex; gap: 0.6rem; margin-bottom: 0.75rem; }
    #concept2-token-row input { flex: 1; }

    .muted { color: var(--muted); font-size: 0.8rem; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0 1rem;
    }
    .controls label {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .controls .spacer { flex: 1; }

    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    th, td {
      text-align: left;
      padding: 0.6rem 0.7rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }
    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 600;
    }
    tbody tr { transition: background-color 0.1s ease; }
    tbody tr:hover { background: var(--row-hover); }
    tbody tr:last-child td { border-bottom: none; }

    td.actions { text-align: right; white-space: nowrap; }
    td.actions a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }
    td.actions a:hover { text-decoration: underline; }

    .hidden { display: none; }

    #status {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    #status.error { color: var(--error); }
  </style>
</head>
<body>
  <header>
    <h1>concept2upload</h1>
    <div id="auth-area"></div>
  </header>

  <div id="signed-out" class="card">
    <p>Sign in to see your Concept2 workouts and download them as .tcx files.</p>
    <button id="sign-in" class="primary">Sign in with Google</button>
  </div>

  <div id="signed-in" class="hidden">
    <div class="card">
      <div id="concept2-token-row">
        <input id="concept2-token" type="password" placeholder="Concept2 Logbook API token" />
        <button id="save-token" class="primary">Save</button>
      </div>
      <p class="muted">
        Get a token from log.concept2.com &gt; Edit Profile &gt; Applications &gt;
        Concept2 Logbook API integration.
      </p>
    </div>

    <div class="card">
      <div class="controls">
        <label>
          Show
          <select id="limit-select">
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
            <option value="250">All (up to 250)</option>
          </select>
        </label>
        <label>
          Times in
          <select id="timezone-select">
            <option value="local" selected>My timezone</option>
            <option value="recorded">As recorded</option>
            <option value="utc">UTC</option>
          </select>
        </label>
        <span class="spacer"></span>
        <button id="refresh-list">Refresh</button>
      </div>

      <table id="workouts">
        <thead>
          <tr><th>Date</th><th>Type</th><th>Distance</th><th>Time</th><th>Workout</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
